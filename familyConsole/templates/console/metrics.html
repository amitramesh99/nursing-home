{% extends 'console/family_dashboard.html' %}
{% load static %}

{% block main %}
<div class="container">
  <div class="card">
    <div class="d-flex w-100 justify-content-between card-body">
      <h2>Metrics</h2>
    </div>
    <ul class="list-group list-group-flush">
      {% for metric in metrics %}
      <li class="list-group-item">
        <div class="row">
          <div class="col">
            <h5 class="mb-1">{{ metric.LABEL }}</h5>
            <small class="text-muted">Last Updated {{ metric.created_at }}</small>
          </div>
          <div class="col-md-5 my-auto">
            <h5 class="mb-0">{{ metric.entry }} <small>{{ metric.unit }}</small>
              <svg width="1.2em" height="1.2em" viewBox="0 0 16 16" class="bi bi-check2-circle" fill="green" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M15.354 2.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3-3a.5.5 0 1 1 .708-.708L8 9.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                <path fill-rule="evenodd" d="M8 2.5A5.5 5.5 0 1 0 13.5 8a.5.5 0 0 1 1 0 6.5 6.5 0 1 1-3.25-5.63.5.5 0 1 1-.5.865A5.472 5.472 0 0 0 8 2.5z"/>
              </svg>
            </h5>
          </div>
        </div>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
{% endblock %}
