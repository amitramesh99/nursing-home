{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'portal/css/family_portal.css' %}">

{% endblock %}

{% block content %}

<main role="main">
  <div class="container">
    <div class="row">
      <div class="col-2 px-0 bg border-right">
        <div class="pt-3 sticky-top">

          <ul class="list-group rounded-0 patient-list">
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/dashboard/' %}current-item{% endif %}" href="{% url 'family-dashboard' %}" style="font-size:20px;font-weight:bold;">Home</a>
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/metrics/' %}current-item{% endif %}" href="{% url 'vital_hub' %}" style="font-size:20px;font-weight:bold;">Health</a>
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/medications/' %}current-item{% endif %}" href="{% url 'wellbeing' %}" style="font-size:20px;font-weight:bold;">Wellbeing</a>
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/communication/' %}current-item{% endif %}" href="{% url 'communication' %}" style="font-size:20px;font-weight:bold;">Communication</a>
          </ul>
        </div>
      </div>
      <div class="col pt-3">
        {% block main %}

        {% endblock %}
      </div>
    </div>
  </div>

</main>
{% endblock %}

{% block scripts %}

{% endblock %}
