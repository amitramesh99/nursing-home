{% extends 'base.html' %}
{% load static %}

{% block stylesheets %}
<link rel="stylesheet" href="{% static 'dashboard/css/nurse_dashboard.css' %}">

{% endblock %}

{% block content %}

<main role="main">
  <div style="width:70%;padding-right:15px;padding-left:15px;margin-right:auto;margin-left:auto">
    <div class="row">
      <div class="col-2 px-0 bg border-right">
        <div class="pt-3 sticky-top">
          <ul class="list-group rounded-0 patient-list">
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/dashboard/' %}current-item{% endif %}" href="{% url 'dashboard' %}" style="font-size:20px;font-weight:bold;">Home</a>
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/vital-hub/' %}current-item{% endif %}" href="{% url 'vitalHub' %}" style="font-size:20px;font-weight:bold;">Health</a>
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/wellbeing/' %}current-item{% endif %}" href="{% url 'wellbeing' %}" style="font-size:20px;font-weight:bold;">Wellbeing</a>
            <a class="list-group-item list-group-item-action border-0 {% if request.get_full_path == '/communication-hub/' %}current-item{% endif %}" href="{% url 'dashboard' %}" style="font-size:20px;font-weight:bold;">Communication</a>
            <a class="list-group-item list-group-item-action border-0" href="{% url 'logout' %}" style="font-size:20px;font-weight:bold;">Logout</a>
          </ul>
        </div>
      </div>
      <div class="col pt-3">
        {% block main %}
    		<div align="center">
          <h3>Create Patient</h3>
          <form action="/" method="post">
            {% csrf_token %}
            <div class="form-group">
              <input id="your_name" class="form-control" type="text" name="your_name" placeholder="Name" value="{{ current_name }}" style="width:50%">
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
          </form>
    		</div>
        {% endblock %}
      </div>
    </div>
  </div>

</main>
{% endblock %}

{% block scripts %}
<script src="{% static 'dashboard/js/nurse_dashboard.js' %}"></script>
{% endblock %}
